name: Deploy

on:
  push:
    branches:
      # `main` menjalankan test lalu deploy production.
      # `dev` sengaja ikut di-trigger, tapi HANYA sampai job `test` — tidak ada
      # environment lain yang dituju sejak staging dibubarkan (lihat PRD §18).
      - main
      - dev

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: walisantri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Cek format kode (Pint)
        run: vendor/bin/pint --test

      - name: Install & build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run test suite (PostgreSQL)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: walisantri_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: php artisan test

  deploy:
    name: Deploy ke VPS (walisantri.com)
    needs: test
    runs-on: ubuntu-latest
    if: success() && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/walisantri

            # Jaminan: apa pun yang terjadi (sukses atau gagal di tengah), situs
            # dikembalikan online saat skrip selesai — jangan sampai macet di 503.
            trap 'php artisan up || true' EXIT

            # Tutup situs sebelum operasi berisiko (pull, swap vendor/asset, migrasi).
            # Pengunjung dapat halaman 503 "sedang pemeliharaan", bukan error acak.
            # --retry: header Retry-After; --refresh: browser auto-muat ulang tiap 15 dtk.
            php artisan down --retry=60 --refresh=15 || true

            git pull origin main
            composer install --no-dev --optimize-autoloader --no-interaction
            npm ci
            npm run build
            bash scripts/backup.sh --db-only --no-offsite --tag pre-deploy || echo "WARN: dump pra-deploy gagal/tidak ada, lanjut deploy"
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan filament:optimize
            php artisan queue:restart

            # Buka kembali situs (trap EXIT juga memanggil ini sebagai cadangan).
            php artisan up

            # Sandbox publik disemai di sini, BUKAN hanya lewat jadwal mingguannya.
            # Tanpa baris ini, server yang belum pernah punya tenant `demo` harus
            # menunggu sampai Senin 04.00 WIB — sampai seminggu — dan selama itu
            # tombol "Lihat Portal Wali" di landing diam-diam jatuh ke tautan
            # cadangan "Lihat Fitur Lengkap". Persis itu yang terjadi setelah rilis
            # v4.42. Perintahnya idempoten dan tidak menyentuh santri, jadi aman
            # dijalankan tiap deploy; dijalankan setelah `up` supaya penyemaian
            # datanya tidak memperpanjang masa pemeliharaan.
            php artisan sandbox:segarkan || echo "WARN: penyemaian sandbox gagal, deploy tetap dianggap sukses"
